# shellcheck shell=bash
#
# Per-web migration configuration. Scripts source this trusted file.
# Copy the repository and edit this file to migrate another Foswiki web.

MIGRATION_ID="AgricultureSummit-2026-09-17"
SOURCE_WEB="AgricultureSummit"
SOURCE_SNAPSHOT="2026-09-17"

TARGET_REPO_SLUG="opengeospatial/AgricultureSummit2017"
TARGET_REPO_URL="https://github.com/opengeospatial/AgricultureSummit2017.git"
TARGET_WIKI_URL="https://github.com/opengeospatial/AgricultureSummit2017.wiki.git"
TARGET_MAIN_BRANCH="main"
TARGET_WIKI_BRANCH="master"
ATTACHMENT_BRANCH="wiki-docs"

# Paths are relative to this repository unless absolute.
EXPORT_ARCHIVE="../AgricultureSummit2017-20260917.tgz"
SOURCE_DIR="Source2026"
BUILD_DIR="build"
MANIFEST_DIR="manifests"

HOME_TOPIC="WebHome"

# Every current *.txt topic is migrated unless its basename appears here.
# Start with the standard Foswiki/TWiki web infrastructure topics, then add
# genuinely web-specific exclusions only after reviewing that web's inventory.
EXCLUDE_TOPICS=(
  WebAtom
  WebChanges
  WebCreateNewTopic
  WebIndex
  WebLeftBar
  WebNotify
  WebPreferences
  WebRss
  WebSearch
  WebSearchAdvanced
  WebStatistics
  WebTopicCreator
  WebTopicEditTemplate
  WebTopicList
)

# "docker" gives a pinned, reproducible Pandoc. Set PANDOC_MODE=local to use
# PANDOC_BIN from PATH instead.
PANDOC_MODE="${PANDOC_MODE:-docker}"
PANDOC_BIN="${PANDOC_BIN:-pandoc}"
PANDOC_IMAGE="${PANDOC_IMAGE:-pandoc/latex:3.8}"
PANDOC_TIMEOUT="${PANDOC_TIMEOUT:-90s}"

GIT_AUTHOR_NAME="${GIT_AUTHOR_NAME:-OGC Foswiki migration}"
GIT_AUTHOR_EMAIL="${GIT_AUTHOR_EMAIL:-noreply@opengeospatial.org}"
MAIN_IMPORT_BRANCH="${MAIN_IMPORT_BRANCH:-migration/foswiki-2026}"
